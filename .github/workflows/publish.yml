# The filename is load-bearing. npm's trusted publisher for
# jbrowse-plugin-ideogram is configured against `publish.yml` exactly, so
# renaming or moving this file silently turns publishing back off.

name: Publish

# Tag-triggered, because `npm version <patch|minor|major>` already ends in
# `postversion: git push --follow-tags`. So cutting a release stays one command
# and this picks the tag up.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole point of trusted publishing: npm trades this short-lived OIDC
      # token for a publish credential, so no NPM_TOKEN secret lives in this
      # repo and there is nothing to leak or rotate.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          # Still needed with trusted publishing. It writes the .npmrc that
          # points at the registry. What it does NOT need is the
          # NODE_AUTH_TOKEN that usually accompanies it.
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # A mistyped tag would publish the wrong version under the right name,
      # and npm only allows unpublishing for 72 hours.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag=${GITHUB_REF_NAME#v}
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, package.json says $pkg" >&2
            exit 1
          fi

      - run: pnpm build

      # npm rather than pnpm for this one step, deliberately. OIDC publishing is
      # npm's own feature and its client is the reference implementation, while
      # pnpm's support has been the flaky part (pnpm/pnpm#9812, and #11513 where
      # OIDC publishing 404'd on pnpm 11.0.8+ after working on 10). pnpm still
      # does the install and the build above, so the toolchain is unchanged.
      #
      # Trusted publishing wants npm >= 11.5.1, and no --provenance flag: npm
      # generates the attestation itself once it sees the OIDC token.
      - name: Publish
        run: |
          npm install -g npm@latest
          npm publish --access public
